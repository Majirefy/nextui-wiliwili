name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.5.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y meson p7zip-full
          sudo chown $(id -u):$(id -g) /opt
          wget -q https://github.com/trimui/toolchain_sdk_smartpro/releases/download/20231018/aarch64-linux-gnu-7.5.0-linaro.tgz
          wget -q https://github.com/trimui/toolchain_sdk_smartpro/releases/download/20231018/SDK_usr_tg5040_a133p.tgz
          make toolchain
      - name: build depency
        run: make download curl libwebp mpv TMPDIR=${{ runner.temp }}
      - name: checkout wiliwili
        uses: actions/checkout@v4
        with:
          repository: dragonflylee/wiliwili
          submodules: true
          fetch-depth: 0
          ref: dev
          path: src/wiliwili
      - name: build wiliwili
        run: |
          make wiliwili
          rm -rf WiliWili.pak
          mkdir -p WiliWili.pak
          install -t WiliWili.pak /opt/trimui/sysroot/usr/lib/libmpv.so.2
          mv build/wiliwili/wiliwili build/wiliwili/resources WiliWili.pak
          cp WiliWili/config.json WiliWili.pak
          cp WiliWili/icon.png WiliWili.pak
          cp WiliWili/launch.sh WiliWili.pak
          cp pak.json WiliWili.pak
          wget -qO WiliWili.pak/cacert.pem https://curl.se/ca/cacert.pem

      - name: Create release archive
        run: |
          7z a -tzip WiliWili-${{ inputs.version }}.zip ./WiliWili.pak/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            WiliWili-${{ inputs.version }}.zip
          body: |
            ## WiliWili for TrimUI Smart Pro - ${{ inputs.version }}

            ### Installation
            1. Download the `WiliWili-${{ inputs.version }}.zip` file
            2. Extract the contents to your TrimUI Smart Pro device
            3. Launch WiliWili from the apps menu

            ### Changes
            Please refer to the commit history for details on changes in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
